wantType:
  metadata:
    name: smartgolf_book
    title: SmartGolf Booking Ready
    description: |
      Navigates the SmartGolf booking flow for a specified room/date/time
      and stops at the confirmation screen (does NOT confirm the reservation).
      Completes after reaching the confirmation page.
    version: '1.0'
    category: smartgolf
    pattern: independent
    labels:
      category-icon: Flag
      category-bg-light: "linear-gradient(160deg, #bbf7d0 0%, #dcfce7 100%)"
      category-bg-dark: "linear-gradient(160deg, #166534 0%, #052e16 100%)"

  finalResultField: summary

  parameters:
    - name: room
      description: "Room name (e.g. 中野新橋店/打席予約(Room02))"
      type: string
      subType: smartgolf_room
      required: true
    - name: date
      description: "Date in YYYY-MM-DD format (JST)"
      type: string
      subType: date
      required: true
    - name: time
      description: "Time in HH:MM format (JST)"
      type: string
      subType: time
      required: true

  state:
    - name: skill_timeout_seconds
      description: Max seconds to wait for the skill script to complete (default 120)
      type: int
      label: goal
      persistent: false
      initialValue: 120

    - name: skill_path
      description: Path to the MRS skill script (set by onInitialize)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: skill_required_params
      description: |
        Space-separated names of required params (e.g. "room date time").
        The MRS agent skips execution until all listed params are non-empty in spec.params.
        Set via onInitialize to enable the "wait for params" pattern.
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: skill_json_arg_template
      description: |
        Template for skill_json_arg with ${param} placeholders.
        Rebuilt from spec.params on each tick where required params are all present.
        Allows param updates (e.g. from choice selection) to be picked up without restart.
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: skill_json_arg
      description: |
        Single JSON string argument passed as sys.argv[1] to the skill script.
        Built dynamically each tick from skill_json_arg_template + current spec.params.
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: mrs_raw_output
      description: Raw JSON output from the MRS skill (source for fetchFrom fields)
      type: object
      label: current
      persistent: false
      initialValue: null

    - name: room
      description: Room name (copied from param)
      type: string
      subType: smartgolf_room
      label: current
      persistent: false
      initialValue: ""

    - name: date
      description: Booking date (copied from param)
      type: string
      subType: date
      label: current
      persistent: false
      initialValue: ""

    - name: time
      description: Booking time (copied from param)
      type: string
      subType: time
      label: current
      persistent: false
      initialValue: ""

    - name: error
      description: Error message if execution failed
      type: string
      label: current
      persistent: true
      initialValue: ""

    - name: summary
      description: >
        Human-readable summary of the SmartGolf booking confirmation screen,
        including room name, date/time, and payment method. Non-empty means
        the booking flow reached the confirmation page successfully.
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true

    - name: reservation_datetime
      description: >
        Reservation date and time as displayed on the SmartGolf confirmation screen
        (e.g. "Sun, Jun 7, 2026 10:00 AM-"). Confirms the slot that was booked.
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.reservation_datetime"

    - name: service
      description: >
        SmartGolf room/service name as displayed on the confirmation screen
        (e.g. "北新宿店/右打席予約(Room01) （60 min）").
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.service"

    - name: payment
      description: >
        Payment method displayed on the SmartGolf confirmation screen
        (e.g. "Monthly fee:SMART GOLF シルバー").
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.payment"

  finalizeWhen:
    achieved:
      field: mrs_raw_output
      operator: "!="
      value: null
    failed:
      field: error
      operator: "!="
      value: ""

  onInitialize:
    current:
      skill_path: "~/.mywant/custom-types/mywant-smartgolf-book-plugin/main.py"
      skill_required_params: "selected_slot"
      skill_json_arg_template: '{"room":"%{room}","date":"%{date}","time":"%{time}"}'

  requires:
    - monitor_mrs_agent

  examples:
    - name: Book SmartGolf Room
      description: Navigate to booking confirmation for a specific room/time
      want:
        metadata:
          name: book_room02
          type: smartgolf_book
        spec:
          params:
            room: "中野新橋店/打席予約(Room02)"
            date: "2026-04-13"
            time: "20:00"
