wantType:
  metadata:
    name: smartgolf_book
    title: SmartGolf Booking Ready
    description: |
      Navigates the SmartGolf booking flow for a specified room/date/time
      and stops at the confirmation screen (does NOT confirm the reservation).
      Completes after reaching the confirmation page.
    version: '1.0'
    category: smartgolf
    pattern: independent

  finalResultField: summary

  parameters:
    - name: room
      description: "Room name (e.g. 中野新橋店/打席予約(Room02))"
      type: string
      required: true
    - name: date
      description: "Date in YYYY-MM-DD format (JST)"
      type: string
      required: true
    - name: time
      description: "Time in HH:MM format (JST)"
      type: string
      required: true

  state:
    - name: skill_timeout_seconds
      description: Max seconds to wait for the skill script to complete (default 120)
      type: int
      label: goal
      persistent: false
      initialValue: 120

    - name: skill_path
      description: Path to the MRS skill script (set by onInitialize)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: skill_json_arg
      description: |
        Single JSON string argument built from params via ${field} interpolation.
        Passed as sys.argv[1] to the skill script.
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: mrs_raw_output
      description: Raw JSON output from the MRS skill (source for fetchFrom fields)
      type: object
      label: current
      persistent: false
      initialValue: null

    - name: room
      description: Room name (copied from param)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: date
      description: Booking date (copied from param)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: time
      description: Booking time (copied from param)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: status
      description: Execution status (pending, done, failed)
      type: string
      label: current
      persistent: true
      initialValue: "pending"

    - name: error
      description: Error message if execution failed
      type: string
      label: current
      persistent: true
      initialValue: ""

    - name: summary
      description: Summary of booking confirmation
      type: string
      label: current
      persistent: true
      initialValue: ""

    - name: reservation_datetime
      description: Reservation date/time as shown on confirmation
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.reservation_datetime"

    - name: service
      description: Service name as shown on confirmation
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.service"

    - name: payment
      description: Payment method as shown on confirmation
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "confirmation.payment"

  onInitialize:
    current:
      status: "pending"
      skill_path: "~/.mywant/custom-types/mywant-smartgolf-book-plugin/main.py"
      skill_json_arg: '{"room":"${room}","date":"${date}","time":{"time":"${time}"}}'

  requires:
    - do_mrs_agent

  examples:
    - name: Book SmartGolf Room
      description: Navigate to booking confirmation for a specific room/time
      want:
        metadata:
          name: book_room02
          type: smartgolf_book
        spec:
          params:
            room: "中野新橋店/打席予約(Room02)"
            date: "2026-04-13"
            time: "20:00"
